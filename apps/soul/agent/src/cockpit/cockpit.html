<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Cockpit</title>
<style>
  /* 単一ファイル・依存ゼロ（CDN/外部フォント/外部スクリプトを持ち込まない）。操縦席は診断面。 */
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2c313b;
    --fg: #e6e8ec;
    --muted: #8b93a1;
    --accent: #57c7a3;
    --down: #ff5d5d;
    --up: #57c7a3;
    --speaking: #f0c14b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .ears { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--up); box-shadow: 0 0 6px var(--up); }
  .dot.off { background: var(--muted); }
  .health { margin-top: 6px; color: var(--muted); display: flex; gap: 18px; }
  .hstat { color: var(--muted); }
  .hstat.up { color: var(--up); }
  .hstat.down { color: var(--down); font-weight: bold; }
  .hstat.unknown { color: var(--muted); }
  section { padding: 14px 18px; }
  .mic { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .mic label { color: var(--muted); }
  /* ── Channel（S3 追撃 domain-c: 器の Control Channel URL の操縦席入力）── */
  .channel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .channel label { color: var(--muted); }
  .channel-status { color: var(--muted); }
  .channel-status.connected { color: var(--up); }
  .channel-status.error { color: var(--down); }
  .channel-status.connecting { color: var(--speaking); }
  select, input[type="text"] {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 4px; min-width: 240px; font: inherit;
  }
  input[type="text"] { min-width: 360px; flex: 1 1 360px; }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  #btn-start { color: var(--up); }
  #btn-stop { color: var(--down); }
  .err { color: var(--down); flex-basis: 100%; }
  /* ── Fire（S3: 発火ボタン + soul の busy 表示）── */
  .fire { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  #btn-fire { color: var(--speaking); font-weight: bold; letter-spacing: 0.04em; }
  .soul-state { color: var(--muted); }
  .soul-state.thinking { color: var(--speaking); }
  .soul-state.speaking { color: var(--speaking); font-weight: bold; }
  .fire-note { color: var(--muted); } /* 非受理 reason の控えめ表示（busy / ears-not-running / empty-window / empty-reply / error）。 */
  .usage-note { color: var(--muted); } /* S5: askごとの usage（累積検知の最小表示）。 */
  /* ── Vision（S5「目が開く」: 対象ウインドウ設定 + 視覚発火ボタン）── */
  .vision { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .vision label { color: var(--muted); }
  .vision-target-status { color: var(--muted); }
  #btn-vision-fire { color: #8fb7ff; font-weight: bold; letter-spacing: 0.04em; }
  /* ── Conversation（S6「会話が続く」: 自発 ON/OFF トグル + 出力デバイス選択）── */
  .conversation { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .conversation label { color: var(--muted); }
  .self-fire-status { color: var(--muted); }
  .self-fire-status.on { color: var(--up); }
  .audio-device-status { color: var(--muted); }
  .timeline-section { padding-bottom: 8px; }
  #timeline {
    height: 46vh; min-height: 220px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    padding: 8px 10px;
  }
  .row { display: flex; gap: 10px; padding: 3px 2px; align-items: baseline; white-space: pre-wrap; }
  .row .time { color: var(--muted); flex: 0 0 auto; }
  .row .who { color: var(--accent); flex: 0 0 auto; min-width: 3.5em; }
  .row.speaker-soul .who { color: #8fb7ff; } /* AI 応答（S3 で実体化: SSE transcript speaker:"soul"）。 */
  .row .text { flex: 1 1 auto; }
  .row .lat { color: var(--muted); flex: 0 0 auto; }
  .row .marker { flex: 0 0 auto; } /* 拡張予約: 発火マーカーの入る余地（S3）。v0 は空。 */
  .row.speaking .text { color: var(--speaking); font-style: italic; }
  .row.ghost .text { color: var(--muted); font-style: italic; } /* 破棄/ASR失敗の無言の消失を可視化（淡色）。 */
  /* 発火マーカー行（S3: 拡張予約の実体化）。Fire 受理の瞬間を Timeline に刻む。 */
  .row.fire-marker { color: var(--speaking); }
  .row.fire-marker .text { color: var(--speaking); }
  /* 演出イベント行（S4「表情が乗る」）。演出適用（語ごとの適用/拒否スロット数）を Timeline に刻む。 */
  .row.expression { color: var(--accent); }
  .row.expression .who { color: var(--accent); }
  .row.expression .text { color: var(--accent); }
  /* 「見た」マーカー行（S5「目が開く」）。視覚発火のキャプチャ成功を縮小サムネ付きで刻む。 */
  .row.vision-marker { color: #8fb7ff; }
  .row.vision-marker .who { color: #8fb7ff; }
  .row.vision-marker .text { color: #8fb7ff; }
  .vision-thumb { max-height: 54px; max-width: 96px; border-radius: 3px; border: 1px solid var(--border); margin-left: 6px; vertical-align: middle; }
  /* barge-in 中断マーカー行（S6「会話が続く」）。相手の発話に遮られて声が止まった瞬間を刻む。 */
  .row.barge-in-marker { color: var(--down); }
  .row.barge-in-marker .who { color: var(--down); }
  .row.barge-in-marker .text { color: var(--down); }
  /* 自発発火マーカー行（S6「会話が続く」）。呼びかけ/区切り/沈黙の自発発火を kind 付きで刻む。 */
  .row.self-fire-marker { color: var(--accent); }
  .row.self-fire-marker .who { color: var(--accent); }
  .row.self-fire-marker .text { color: var(--accent); }
  footer {
    padding: 10px 18px; border-top: 1px solid var(--border);
    color: var(--muted); display: flex; gap: 24px; background: var(--panel);
  }
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Soul Cockpit</h1>
      <div class="ears">
        <span id="ears-dot" class="dot off"></span>
        <span id="ears-status">Stopped</span>
      </div>
    </div>
    <div class="health">
      <span>whisper: <span id="health-whisper" class="hstat unknown">unknown</span></span>
      <span>ffmpeg: <span id="health-ffmpeg" class="hstat unknown">unknown</span></span>
    </div>
  </header>

  <section class="mic">
    <label for="device-select">Microphone</label>
    <select id="device-select"></select>
    <button id="btn-start">Start</button>
    <button id="btn-stop">Stop</button>
    <span id="devices-error" class="err"></span>
  </section>

  <!-- S3 追撃 domain-c: Channel URL の操縦席入力（CLI を触らず器の Control Channel を結ぶ）。 -->
  <section class="channel">
    <label for="channel-url">Channel</label>
    <input id="channel-url" type="text" placeholder="ws://127.0.0.1:PORT/channel?token=..." autocomplete="off" spellcheck="false">
    <button id="btn-channel-set">Set</button>
    <span id="channel-status" class="channel-status">not configured</span>
    <span id="channel-error" class="err"></span>
  </section>

  <!-- S5「目が開く」: 視覚発火の対象ウインドウ設定（一覧取得→選択→POST /api/vision-target で永続化）。 -->
  <section class="vision">
    <label for="vision-target-select">Vision target</label>
    <select id="vision-target-select"></select>
    <button id="btn-vision-refresh">Refresh windows</button>
    <button id="btn-vision-target-set">Set target</button>
    <span id="vision-target-status" class="vision-target-status">not configured</span>
    <span id="vision-error" class="err"></span>
  </section>

  <!-- S6「会話が続く」: 自発 ON/OFF トグル（呼びかけ/区切り/沈黙。手動 Fire は影響を受けない）+
       出力デバイス選択（一覧取得→選択→POST /api/audio-device で永続化。適用は常駐プレイヤーのその場再起動）。 -->
  <section class="conversation">
    <label for="self-fire-toggle">Self-fire</label>
    <input type="checkbox" id="self-fire-toggle">
    <span id="self-fire-status" class="self-fire-status">off</span>
    <label for="audio-device-select">Voice output</label>
    <select id="audio-device-select"></select>
    <button id="btn-audio-refresh">Refresh devices</button>
    <button id="btn-audio-device-set">Set device</button>
    <span id="audio-device-status" class="audio-device-status">default</span>
    <span id="conversation-error" class="err"></span>
  </section>

  <!-- S3: 発火（Fire）。実運用のゲーム中発火は AHK → POST /api/fire（scripts/fire-hotkey.ahk）。 -->
  <!-- S5: 視覚発火（Fire Vision）は POST /api/vision-fire（AHK 第二ホットキー = Ctrl+Alt+G）。 -->
  <section class="fire">
    <button id="btn-fire">Fire</button>
    <button id="btn-vision-fire">Fire (vision)</button>
    <span>soul: <span id="soul-status" class="soul-state idle">idle</span></span>
    <span id="fire-note" class="fire-note"></span>
    <span id="usage-note" class="usage-note"></span>
  </section>

  <section class="timeline-section">
    <h2>Timeline</h2>
    <div id="timeline" role="log" aria-live="polite"></div>
  </section>

  <footer>
    <span>discarded: <span id="footer-discarded">0</span></span>
    <span>uptime: <span id="footer-uptime">00:00:00</span></span>
  </footer>

  <script>
  // 正本はプロセス側・UI は使い捨てのビュー（screens/soul-cockpit.md §1）。
  // 消費するワイヤ契約は Domain A のもののみ: S2.5（waves/s2.5/domain-a.md §3 HTTP・§4 SSE）
  // + S3（waves/s3/domain-a.md §2: POST /api/fire・SSE soul/fire/diagnostic）。
  (function () {
    "use strict";
    var byId = function (id) { return document.getElementById(id); };
    var timeline = byId("timeline");

    // ── uptime（listening 中はローカルで 1s 刻み・state 到着で再同期）──
    var uptimeBaseMs = 0;
    var uptimeAnchor = Date.now();
    var earsListening = false;

    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function fmtHms(ms) {
      var s = Math.floor(ms / 1000);
      return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
    }
    function fmtClock(epochMs) {
      var d = new Date(epochMs);
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function renderUptime() {
      var ms = earsListening ? (uptimeBaseMs + (Date.now() - uptimeAnchor)) : 0;
      byId("footer-uptime").textContent = fmtHms(ms);
    }
    setInterval(renderUptime, 1000);

    // ── ヘッダ/フッタ = state スナップショット（GET /api/state / SSE state）──
    function applyState(s) {
      if (!s) return;
      earsListening = s.ears === "listening";
      byId("ears-status").textContent =
        s.ears === "listening" ? "Listening" : (s.ears === "starting" ? "Starting" : "Stopped");
      byId("ears-dot").className = "dot " + (earsListening ? "on" : "off");
      if (s.health) {
        applyHealth("health-whisper", s.health.whisper);
        applyHealth("health-ffmpeg", s.health.ffmpeg);
      }
      byId("footer-discarded").textContent = s.discarded;
      uptimeBaseMs = s.uptimeMs || 0;
      uptimeAnchor = Date.now();
      renderUptime();
      applyChannel(s.channel);
      applyVisionTarget(s.visionTarget);
      applySelfFire(s.selfFire);
      applyAudioDevice(s.audioDevice);
    }
    // ── Vision target 現況表示（S5「目が開く」）: state.visionTarget = { title } | null ──
    function applyVisionTarget(vt) {
      var el = byId("vision-target-status");
      el.textContent = vt && vt.title ? vt.title : "not configured";
    }
    // ── Self-fire トグル現況表示（S6「会話が続く」）: state.selfFire = { enabled } | null ──
    // null（scheduler 未生成 = orchestrator 未注入）は「使えない」ことをトグル disable で表す。
    var selfFireSyncing = false;
    function applySelfFire(sf) {
      var toggle = byId("self-fire-toggle");
      var status = byId("self-fire-status");
      if (!sf) {
        toggle.disabled = true;
        toggle.checked = false;
        status.textContent = "not available";
        status.className = "self-fire-status";
        return;
      }
      toggle.disabled = false;
      selfFireSyncing = true;
      toggle.checked = !!sf.enabled;
      selfFireSyncing = false;
      status.textContent = sf.enabled ? "on" : "off";
      status.className = "self-fire-status " + (sf.enabled ? "on" : "");
    }
    // ── 出力デバイス現況表示（S6「会話が続く」）: state.audioDevice = { name } | null ──
    function applyAudioDevice(ad) {
      var el = byId("audio-device-status");
      el.textContent = ad && ad.name ? ad.name : "default";
    }
    // ── Channel 状態表示（S3 追撃 domain-c）: state.channel は redact 済み（token は伏せてある）──
    function applyChannel(ch) {
      var el = byId("channel-status");
      if (!ch || !ch.configured) {
        el.textContent = "not configured";
        el.className = "channel-status";
        return;
      }
      var conn = ch.connection || "idle";
      el.textContent = (ch.url || "(configured)") + " — " + conn;
      // 接続状態の色分け（connected=緑 / error=赤 / connecting=黄 / それ以外=muted）。
      el.className = "channel-status " +
        (conn === "connected" ? "connected" : (conn === "error" ? "error" : (conn === "connecting" ? "connecting" : "")));
    }
    function applyHealth(id, h) {
      if (!h) return;
      var el = byId(id);
      el.textContent = h.status + (h.status === "down" && h.reason ? " — " + h.reason : "");
      el.className = "hstat " + h.status; // down は CSS で赤 + 太字
      el.title = h.reason || "";
    }

    // ── Timeline ──
    var speakingRow = null;
    function removeSpeakingRow() {
      if (speakingRow && speakingRow.parentNode) speakingRow.parentNode.removeChild(speakingRow);
      speakingRow = null;
    }
    function showSpeakingRow() {
      if (speakingRow) return;
      speakingRow = document.createElement("div");
      speakingRow.className = "row speaking";
      var t = document.createElement("span"); t.className = "time";
      var who = document.createElement("span"); who.className = "who"; who.textContent = "you";
      var text = document.createElement("span"); text.className = "text"; text.textContent = "······(speaking)";
      speakingRow.appendChild(t); speakingRow.appendChild(who); speakingRow.appendChild(text);
      timeline.appendChild(speakingRow);
      timeline.scrollTop = timeline.scrollHeight;
    }
    // 話者ラベルは you / soul（S3 で soul 実体化: 魂の発話は SSE transcript speaker:"soul" で届く）。
    function addTranscriptRow(d) {
      removeSpeakingRow();
      var speaker = d.speaker || "you";
      var row = document.createElement("div");
      row.className = "row speaker-" + speaker;
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(d.appendedAtMs || Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = speaker;
      var text = document.createElement("span"); text.className = "text"; text.textContent = d.text;
      var marker = document.createElement("span"); marker.className = "marker"; // 発火マーカーの余地（S3）
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      // 転写レイテンシは live 行のみに載る（履歴エントリには契約上載らない・domain-a.md §3.3 注）。
      if (d.latencyMs != null) {
        var lat = document.createElement("span"); lat.className = "lat";
        lat.textContent = "(" + (d.latencyMs / 1000).toFixed(1) + "s)";
        row.appendChild(lat);
      }
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }
    // タブ開き直し復元: GET /api/state の transcripts[]（レイテンシ無し = live 行のみ表示で正）。
    function renderHistory(transcripts) {
      timeline.innerHTML = "";
      for (var i = 0; i < transcripts.length; i += 1) addTranscriptRow(transcripts[i]);
    }

    // ── ゴースト行（破棄/ASR失敗を「無言の消失」でなくタイムラインに残す）──
    // discard（空転写破棄）/ diagnostic type=="asrFailure"（転写失敗）の span を淡色行で表示。
    function addGhostRow(label) {
      removeSpeakingRow();
      var row = document.createElement("div");
      row.className = "row ghost";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(Date.now());
      var who = document.createElement("span"); who.className = "who"; // 話者不明のため空。
      var text = document.createElement("span"); text.className = "text"; text.textContent = label;
      var marker = document.createElement("span"); marker.className = "marker";
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }

    // ── Fire（S3: 拡張予約の実体化）───────────────────────────────
    // busy 表示は SSE `soul` イベント（idle/thinking/speaking）連動。thinking/speaking 中は
    // Fire ボタンを disable（busy 中の Fire はサーバ側でも無視される・二重の防波堤）。
    function applySoulState(state) {
      var st = state === "thinking" || state === "speaking" ? state : "idle";
      var el = byId("soul-status");
      el.textContent = st;
      el.className = "soul-state " + st;
      byId("btn-fire").disabled = st !== "idle";
      byId("btn-vision-fire").disabled = st !== "idle"; // S5: 視覚発火も busy 中は disable（二重の防波堤）。
    }
    function setFireNote(text) {
      byId("fire-note").textContent = text || "";
    }
    // 発火マーカー行: Fire 受理（SSE fire accepted:true）の瞬間を Timeline に刻む。
    // 直後の soul 行の .marker に印を付ける案もあるが、fire → soul 行到着まで思考時間の
    // 空白があるため、受理そのものを独立行で残す（時間差も読める）。
    function addFireMarkerRow(d) {
      var row = document.createElement("div");
      row.className = "row fire-marker";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(d.atMs || Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = "fire";
      var marker = document.createElement("span"); marker.className = "marker"; marker.textContent = "*";
      var text = document.createElement("span"); text.className = "text";
      text.textContent = "fired (" + (d.includedCount != null ? d.includedCount : "?") + " lines, " +
        (d.injectedChars != null ? d.injectedChars : "?") + " chars injected)";
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }
    // 演出イベント行（S4「表情が乗る」）: SSE "expression"（{word, args?, applied, rejected}・
    // domain-a.md §7）を発火マーカーと同型の 1 行で描く。語（+任意 args）+ 適用/拒否スロット数
    // （例「smile ✓2/✗0」）。声にも会話ログにも出ない演出の適用痕跡を Timeline に残す。
    // 調整 UI（強さ係数スライダー等）は操縦席に置かない裁定——ここは表示のみ（運用面は CLI/設定限定）。
    function addExpressionRow(d) {
      var row = document.createElement("div");
      row.className = "row expression";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = "expr";
      var marker = document.createElement("span"); marker.className = "marker"; marker.textContent = "◆";
      var text = document.createElement("span"); text.className = "text";
      var word = d.word != null ? d.word : "?";
      var args = d.args ? " " + d.args : "";
      var applied = d.applied != null ? d.applied : 0;
      var rejected = d.rejected != null ? d.rejected : 0;
      text.textContent = word + args + " ✓" + applied + "/✗" + rejected;
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }

    // ── 「見た」マーカー行（S5「目が開く」）───────────────────────────
    // SSE "visionCaptured"（{title,width,height,jpegBase64,elapsedMs}・domain-b.md §4-1）を
    // 縮小サムネ付きの 1 行で Timeline に刻む。サムネはブラウザの <img> にだけ渡し、どこにも保存しない。
    function addVisionMarkerRow(d) {
      var row = document.createElement("div");
      row.className = "row vision-marker";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = "vision";
      var marker = document.createElement("span"); marker.className = "marker"; marker.textContent = "*";
      var text = document.createElement("span"); text.className = "text";
      text.textContent = "saw \"" + (d.title || "?") + "\" (" + d.width + "x" + d.height + ", " +
        (d.elapsedMs != null ? d.elapsedMs : "?") + "ms)";
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      if (d.jpegBase64) {
        var img = document.createElement("img");
        img.className = "vision-thumb";
        img.alt = "captured window thumbnail";
        img.src = "data:image/jpeg;base64," + d.jpegBase64;
        row.appendChild(img);
      }
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }

    // ── barge-in 中断マーカー行（S6「会話が続く」）───────────────────────────
    // diagnostic type=="bargeIn"（{elapsedMs,charsSpoken,totalChars,prefix}）を専用行に描く。
    // 相手の発話に遮られて声が止まった「事実」を、破棄/ASR失敗のゴースト行とは別枠の目立つ行で刻む。
    function addBargeInMarkerRow(d) {
      var row = document.createElement("div");
      row.className = "row barge-in-marker";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = "barge-in";
      var marker = document.createElement("span"); marker.className = "marker"; marker.textContent = "!!";
      var text = document.createElement("span"); text.className = "text";
      var chars = (d.charsSpoken != null ? d.charsSpoken : "?") + "/" + (d.totalChars != null ? d.totalChars : "?");
      text.textContent = "interrupted (" + chars + " chars spoken, " + (d.elapsedMs != null ? d.elapsedMs : "?") + "ms)";
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }

    // ── 自発発火マーカー行（S6「会話が続く」）─────────────────────────────────
    // SSE "selfFire"（{kind,fired,reason}・kind: call/turn-end/silence）を描く。fired:true は
    // kind 付きの専用マーカー行（実際に撃った自発発火）、fired:false はスケジューラ診断のゴースト行
    // （発火要求は出たが busy/no-target 等で実際には発火しなかった事実）として区別する。
    function addSelfFireMarkerRow(d) {
      var row = document.createElement("div");
      row.className = "row self-fire-marker";
      var t = document.createElement("span"); t.className = "time";
      t.textContent = fmtClock(Date.now());
      var who = document.createElement("span"); who.className = "who"; who.textContent = "self";
      var marker = document.createElement("span"); marker.className = "marker"; marker.textContent = "~";
      var text = document.createElement("span"); text.className = "text";
      text.textContent = "self-fire (" + (d.kind || "?") + ")";
      row.appendChild(t); row.appendChild(who); row.appendChild(marker); row.appendChild(text);
      timeline.appendChild(row);
      timeline.scrollTop = timeline.scrollHeight;
    }

    // ── usage 表示（S5: askごとの usage・累積の重さを早期検知できる最小表示）──
    // ツマミは置かない（v0 裁定）: 直近askの input_tokens だけを控えめに出す。
    function applyUsage(d) {
      var el = byId("usage-note");
      var usage = d && d.usage ? d.usage : {};
      var it = usage.input_tokens != null ? usage.input_tokens : "?";
      var ot = usage.output_tokens != null ? usage.output_tokens : "?";
      el.textContent = "usage" + (d && d.vision ? "(vision)" : "") +
        ": input=" + it + " output=" + ot;
    }
    byId("btn-fire").addEventListener("click", function () {
      byId("btn-fire").disabled = true; // 連打防止（復帰は応答 state / SSE soul）。
      setFireNote("");
      fetch("/api/fire", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
        .then(function (res) {
          // 503 = fire 未結線（--channel なしで起動）。fired:false は reason を控えめに表示。
          if (res.status === 503) setFireNote("fire not available (start cockpit with --channel)");
          else if (res.j && res.j.fired === false) setFireNote("not fired: " + (res.j.reason || "unknown"));
          applySoulState(res.j && res.j.state ? res.j.state : "idle");
        })
        .catch(function (e) {
          setFireNote("fire error: " + e);
          applySoulState("idle");
        });
    });

    // ── 視覚発火（S5「目が開く」）: POST /api/vision-fire。Fire ボタンと同型のフロー ──
    byId("btn-vision-fire").addEventListener("click", function () {
      byId("btn-vision-fire").disabled = true; // 連打防止（復帰は応答 state / SSE soul）。
      setFireNote("");
      fetch("/api/vision-fire", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
        .then(function (res) {
          // 503 = fire 未結線（--channel なしで起動）。fired:false は reason を控えめに表示
          // （vision-no-target / vision-capture-failed / busy / ears-not-running 等）。
          if (res.status === 503) setFireNote("fire not available (start cockpit with --channel)");
          else if (res.j && res.j.fired === false) setFireNote("not fired: " + (res.j.reason || "unknown"));
          applySoulState(res.j && res.j.state ? res.j.state : "idle");
        })
        .catch(function (e) {
          setFireNote("vision fire error: " + e);
          applySoulState("idle");
        });
    });

    // ── 対象ウインドウ設定（S5「目が開く」）: GET /api/windows → select → POST /api/vision-target ──
    function loadWindows() {
      return fetch("/api/windows").then(function (r) { return r.json(); }).then(function (j) {
        var sel = byId("vision-target-select");
        sel.innerHTML = "";
        if (!j.windows || j.windows.length === 0) {
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = j.error ? "(window enumeration failed)" : "(no windows)";
          sel.appendChild(opt);
        } else {
          for (var i = 0; i < j.windows.length; i += 1) {
            var o = document.createElement("option");
            o.value = j.windows[i].title;
            o.textContent = j.windows[i].title + " (" + j.windows[i].processName + ")";
            sel.appendChild(o);
          }
        }
        byId("vision-error").textContent = j.error ? ("windows: " + j.error) : "";
      }).catch(function (e) {
        byId("vision-error").textContent = "failed to load windows: " + e;
      });
    }
    byId("btn-vision-refresh").addEventListener("click", function () { loadWindows(); });
    byId("btn-vision-target-set").addEventListener("click", function () {
      var title = byId("vision-target-select").value || "";
      byId("vision-error").textContent = "";
      fetch("/api/vision-target", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ title: title })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
      }).then(function (res) {
        if (res.status === 503) { byId("vision-error").textContent = "vision target control not available"; return; }
        if (!res.ok) { byId("vision-error").textContent = "set failed: " + (res.j && res.j.error || "error"); return; }
        applyVisionTarget(res.j.visionTarget);
      }).catch(function (e) {
        byId("vision-error").textContent = "vision target error: " + e;
      });
    });

    // ── Self-fire トグル（S6「会話が続く」）: POST /api/self-fire { enabled } ──
    // 手動 Fire ボタンとは独立（自発 OFF でも Fire ボタンは常に有効・トグルは呼びかけ/区切り/沈黙のみ制御）。
    byId("self-fire-toggle").addEventListener("change", function () {
      if (selfFireSyncing) return; // applySelfFire からの反映中は POST しない（無限ループ防止）。
      var enabled = byId("self-fire-toggle").checked;
      byId("conversation-error").textContent = "";
      fetch("/api/self-fire", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ enabled: enabled })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
      }).then(function (res) {
        if (res.status === 503) { byId("conversation-error").textContent = "self-fire control not available"; return; }
        if (!res.ok) { byId("conversation-error").textContent = "set failed: " + (res.j && res.j.error || "error"); return; }
        applySelfFire(res.j.selfFire);
      }).catch(function (e) {
        byId("conversation-error").textContent = "self-fire error: " + e;
      });
    });

    // ── 出力デバイス設定（S6「会話が続く」）: GET /api/audio-devices → select → POST /api/audio-device ──
    // 適用は常駐プレイヤーのその場再起動（次に声を出すときから新デバイス。scripts/cockpit.mjs 参照）。
    function loadAudioDevices() {
      return fetch("/api/audio-devices").then(function (r) { return r.json(); }).then(function (j) {
        var sel = byId("audio-device-select");
        sel.innerHTML = "";
        if (!j.devices || j.devices.length === 0) {
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = j.error ? "(device enumeration failed)" : "(no output devices)";
          sel.appendChild(opt);
        } else {
          for (var i = 0; i < j.devices.length; i += 1) {
            var o = document.createElement("option");
            o.value = j.devices[i].name;
            o.textContent = j.devices[i].name;
            sel.appendChild(o);
          }
        }
        byId("conversation-error").textContent = j.error ? ("devices: " + j.error) : "";
      }).catch(function (e) {
        byId("conversation-error").textContent = "failed to load audio devices: " + e;
      });
    }
    byId("btn-audio-refresh").addEventListener("click", function () { loadAudioDevices(); });
    byId("btn-audio-device-set").addEventListener("click", function () {
      var name = byId("audio-device-select").value || "";
      byId("conversation-error").textContent = "";
      fetch("/api/audio-device", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
      }).then(function (res) {
        if (res.status === 503) { byId("conversation-error").textContent = "audio device control not available"; return; }
        if (!res.ok) { byId("conversation-error").textContent = "set failed: " + (res.j && res.j.error || "error"); return; }
        applyAudioDevice(res.j.audioDevice);
      }).catch(function (e) {
        byId("conversation-error").textContent = "audio device error: " + e;
      });
    });

    // ── Microphone: GET /api/devices → dropdown（lastDevice を初期選択）──
    function selectDeviceIfPresent(name) {
      var sel = byId("device-select");
      for (var i = 0; i < sel.options.length; i += 1) {
        if (sel.options[i].value === name) { sel.selectedIndex = i; return; }
      }
    }
    function loadDevices() {
      return fetch("/api/devices").then(function (r) { return r.json(); }).then(function (j) {
        var sel = byId("device-select");
        sel.innerHTML = "";
        if (!j.devices || j.devices.length === 0) {
          var opt = document.createElement("option");
          opt.value = "";
          opt.textContent = j.error ? "(device enumeration failed)" : "(no input devices)";
          sel.appendChild(opt);
        } else {
          for (var i = 0; i < j.devices.length; i += 1) {
            var o = document.createElement("option");
            o.value = j.devices[i].name;
            o.textContent = j.devices[i].name;
            sel.appendChild(o);
          }
        }
        if (j.lastDevice) selectDeviceIfPresent(j.lastDevice);
        byId("devices-error").textContent = j.error ? ("devices: " + j.error) : "";
      }).catch(function (e) {
        byId("devices-error").textContent = "failed to load devices: " + e;
      });
    }

    // ── 制御: POST /api/ears/start（選択デバイス）/ POST /api/ears/stop ──
    function setBusy(b) { byId("btn-start").disabled = b; byId("btn-stop").disabled = b; }
    byId("btn-start").addEventListener("click", function () {
      var device = byId("device-select").value || null;
      setBusy(true);
      fetch("/api/ears/start", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ device: device })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        if (!res.ok) {
          byId("devices-error").textContent = "start failed: " + (res.j.error || "error");
          applyState(res.j.state);
        } else {
          byId("devices-error").textContent = "";
          applyState(res.j);
        }
      }).catch(function (e) {
        byId("devices-error").textContent = "start error: " + e;
      }).then(function () { setBusy(false); });
    });
    // ── Channel: POST /api/channel（URL を器の Control Channel として設定/変更）──
    // 入力欄は生 URL を受ける（token 込み）。表示（channel-status）は redact 済みの state で更新する。
    byId("btn-channel-set").addEventListener("click", function () {
      var raw = byId("channel-url").value || "";
      byId("channel-error").textContent = "";
      fetch("/api/channel", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ url: raw })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
      }).then(function (res) {
        if (res.status === 503) { byId("channel-error").textContent = "channel control not available"; return; }
        if (!res.ok) { byId("channel-error").textContent = "set failed: " + (res.j && res.j.error || "error"); return; }
        applyState(res.j); // snapshot（redact 済み channel を含む）で状態を更新。
        byId("channel-url").value = ""; // 生 URL（token）を入力欄に残さない。
      }).catch(function (e) {
        byId("channel-error").textContent = "channel error: " + e;
      });
    });
    byId("btn-stop").addEventListener("click", function () {
      setBusy(true);
      fetch("/api/ears/stop", { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (j) { applyState(j); })
        .catch(function (e) { byId("devices-error").textContent = "stop error: " + e; })
        .then(function () { setBusy(false); });
    });

    // ── 初期描画 + SSE 購読（GET /api/events）──
    function subscribe() {
      var es = new EventSource("/api/events");
      es.addEventListener("state", function (ev) { applyState(JSON.parse(ev.data)); });
      es.addEventListener("vad", function (ev) {
        var d = JSON.parse(ev.data);
        if (d.type === "speechStart") showSpeakingRow();
        else if (d.type === "speechEnd" || d.type === "speechCancel") removeSpeakingRow();
      });
      es.addEventListener("transcript", function (ev) { addTranscriptRow(JSON.parse(ev.data)); });
      // S4「表情が乗る」: 演出適用の語ごとの通知（{word, args?, applied, rejected}）を演出イベント行に。
      es.addEventListener("expression", function (ev) { addExpressionRow(JSON.parse(ev.data)); });
      es.addEventListener("discard", function (ev) {
        var d = JSON.parse(ev.data);
        byId("footer-discarded").textContent = d.discarded;
        addGhostRow("(discarded)");
      });
      es.addEventListener("diagnostic", function (ev) {
        var d = JSON.parse(ev.data);
        if (d.type === "asrFailure") addGhostRow("(asr failed)");
        // S3: 発火失敗系もゴースト行の型で「無言の消失」にしない（Domain A 引き継ぎ Q3 の裁量）。
        else if (d.type === "fireEmptyReply") addGhostRow("(fire: empty reply)");
        else if (d.type === "fireError") addGhostRow("(fire error: " + (d.message || "unknown") + ")");
        // S4「表情が乗る」: 語彙外タグ（教示外の語）は声にも演出にも出ないが、痕跡をゴースト行に残す。
        else if (d.type === "expressionUnknownTag") addGhostRow("(unknown tag: " + (d.tag || "?") + ")");
        // S5「目が開く」: 視覚発火の失敗（対象未設定/窓消失/最小化/キャプチャ失敗）を kind 付きで
        // ゴースト行に残す（盲目のまま撃たず正直に中止した痕跡・domain-b.md §3-3）。
        else if (d.type === "fireVisionError") addGhostRow("(vision fire: " + (d.kind || "?") + (d.message ? " — " + d.message : "") + ")");
        // S6「会話が続く」: barge-in 中断（相手の発話に遮られて声が止まった）は専用マーカー行に。
        else if (d.type === "bargeIn") addBargeInMarkerRow(d);
        // S6: barge-in の付随的失敗（声止め/口閉じの失敗）はゴースト行に残す（中断処理自体は続行済み）。
        else if (d.type === "bargeInStopError") addGhostRow("(barge-in: player.stop failed — " + (d.message || "?") + ")");
        else if (d.type === "bargeInMouthCloseRejected") addGhostRow("(barge-in: mouth-close rejected)");
        else if (d.type === "bargeInMouthCloseError") addGhostRow("(barge-in: mouth-close failed — " + (d.message || "?") + ")");
        // 他の演出診断は非表示（過剰表示を避ける・S3 の抑制方針に倣う）:
        //  - expressionBrokenTag は壊れ括弧の除去痕（パース副産物・ノイズ）。
        //  - expressionRejected / expressionSendError は発話済み fire のスロット単位の器拒否/送出失敗で、
        //    その語の演出イベント行が既に ✗N（拒否スロット数）で伝える＝二重表示を避ける。
        // 他の診断型は拡張予約: 補助情報の表示余地（S4+）。未表示。
      });
      // S3: soul の busy 状態（idle/thinking/speaking）と発火通知。
      es.addEventListener("soul", function (ev) {
        applySoulState(JSON.parse(ev.data).state);
      });
      es.addEventListener("fire", function (ev) {
        var d = JSON.parse(ev.data);
        if (d.accepted === true) { setFireNote(""); addFireMarkerRow(d); }
        else setFireNote("not fired: " + (d.reason || "unknown"));
      });
      // S5「目が開く」: 「見た」事実（キャプチャ成功・サムネ込み）を Timeline の専用行に。
      es.addEventListener("visionCaptured", function (ev) { addVisionMarkerRow(JSON.parse(ev.data)); });
      // S5: askごとの usage（通常 Fire・視覚発火の両方・累積の重さの早期検知用の最小表示）。
      es.addEventListener("usage", function (ev) { applyUsage(JSON.parse(ev.data)); });
      // S6「会話が続く」: 自発発火の要求（kind: call/turn-end/silence）。fired:true は自発発火マーカー行、
      // fired:false はスケジューラ診断のゴースト行（要求は出たが busy/no-target 等で発火しなかった）。
      es.addEventListener("selfFire", function (ev) {
        var d = JSON.parse(ev.data);
        if (d.fired) addSelfFireMarkerRow(d);
        else addGhostRow("(self-fire: " + (d.kind || "?") + " not fired — " + (d.reason || "?") + ")");
      });
    }
    function init() {
      loadDevices().then(function () {
        return fetch("/api/state").then(function (r) { return r.json(); }).then(function (s) {
          renderHistory(s.transcripts || []); // 履歴復元（live は SSE transcript で以後追加）
          applyState(s);
        }).catch(function () { /* 状態取得失敗でもページは開く */ });
      }).then(function () { return loadWindows(); }) // S5: 対象ウインドウ選択肢の初期取得。
        .then(function () { return loadAudioDevices(); }) // S6: 出力デバイス選択肢の初期取得。
        .then(subscribe);
    }
    init();
  })();
  </script>
</body>
</html>
