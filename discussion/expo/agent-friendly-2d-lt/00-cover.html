<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エージェントフレンドリーな2Dモデリングシステム</title>
  <link rel="stylesheet" href="slide-theme.css">
</head>
<body>
  <main class="slide-stage">
    <section class="slide" aria-labelledby="slide-title">
      <h1 class="slide-title" id="slide-title">エージェントフレンドリーな2Dモデリングシステム</h1>
      <div class="slide-rule" aria-hidden="true"></div>
      <div class="slide-content">
      </div>
    </section>
  </main>
  <script>
    function fitSlides() {
      document.documentElement.style.setProperty('--preview-scale', Math.min(innerWidth / 1600, innerHeight / 900));
    }
    addEventListener('resize', fitSlides);
    fitSlides();
  </script>
</body>
</html>
