<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信用ツール：モデルの実行とAIの会話・行動</title>
  <link rel="stylesheet" href="slide-theme.css">
</head>
<body>
  <main class="slide-stage">
    <section class="slide slide--with-summary slide--runtime" aria-labelledby="slide-title">
      <h1 class="slide-title" id="slide-title">配信用ツール：モデルの実行とAIの会話・行動</h1>
      <div class="slide-rule" aria-hidden="true"></div>
      <div class="slide-summary">
        <p class="slide-lead">モデルを動かすPlayerと、AIの会話・行動を制御するシステムを用意</p>
      </div>
      <div class="slide-content">
        <div class="runtime-layout">
          <div class="runtime-controls">
            <figure class="screenshot-figure">
              <figcaption>2Dモデルプレイヤー</figcaption>
              <img src="assets/runtime-player.png" width="1293" height="703" alt="Runtime Playerの操作画面。衣装切り替えやモデル表示の操作を行う。">
            </figure>
            <figure class="screenshot-figure">
              <figcaption>AI会話・行動システム</figcaption>
              <img src="assets/ai-conversation-settings.png" width="970" height="347" alt="AI会話・行動システムの設定画面。マイク、声の出力先、視界を設定する。">
            </figure>
          </div>
          <figure class="screenshot-figure runtime-model">
            <figcaption>モデルの表示例</figcaption>
            <img src="assets/runtime-model.png" width="939" height="896" alt="Playerで表示している、黒い衣装と帽子を着けた白髪の2Dモデル。">
          </figure>
        </div>
      </div>
    </section>
  </main>
  <script>
    function fitSlides() {
      document.documentElement.style.setProperty('--preview-scale', Math.min(innerWidth / 1600, innerHeight / 900));
    }
    addEventListener('resize', fitSlides);
    fitSlides();
  </script>
</body>
</html>
