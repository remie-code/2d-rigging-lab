<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LTスライド一覧</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #e9edf0; color: #182a38; font-family: "Yu Gothic", "Meiryo", sans-serif; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 32px; max-width: 1856px; margin: auto; }
    figure { margin: 0; }
    figcaption { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: white; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #247cad; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main aria-label="発表順のスライド一覧">
    <figure><figcaption>1 ／ 表紙・アーカイブ</figcaption><a href="00-cover-preview.png"><img src="00-cover-preview.png" alt="エージェントフレンドリーな2Dモデリングシステム。展示物紹介配信アーカイブのQRコード。"></a></figure>
    <figure><figcaption>2 ／ 今回開発したもの</figcaption><a href="01-overview-preview.png"><img src="01-overview-preview.png" alt="画像素材からモデル制作、会話・実行、OBS・YouTube配信までの全体図。"></a></figure>
    <figure><figcaption>3 ／ モデリングツール</figcaption><a href="02-modeling-tools-preview.png"><img src="02-modeling-tools-preview.png" alt="人間用GUIとエージェント用CLIの紹介。"></a></figure>
    <figure><figcaption>4 ／ 配信用ツール</figcaption><a href="03-streaming-tools-preview.png"><img src="03-streaming-tools-preview.png" alt="Player、AI会話・行動システム、モデルの表示例。"></a></figure>
    <figure><figcaption>5 ／ オチ</figcaption><a href="04-development-duration-preview.png"><img src="04-development-duration-preview.png" alt="結局、会場で来客の気を引いたのは……開発期間：約2週間。"></a></figure>
  </main>
</body>
</html>
