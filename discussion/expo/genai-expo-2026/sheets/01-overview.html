<meta charset="utf-8">
<title>01 生成AIが操作する2Dモデリング環境</title>
<style>
  /* ── A2 縦(420 × 594mm)。他の面と同じ版面規格・同じ配色。
     展示の入口。写真を使わないため全要素がベクター。
     縦の余りは 2 つの箱が分け合って版面を使い切る(flex)。 */
  @page { size: 420mm 594mm; margin: 0; }

  :root {
    --u: 4.2mm;
    --paper: #fcfdfe;
    --navy: #05285b;
    --navy-d: #072c62;
    --ink: #16233a;
    --sub: #5b6472;
    --line: #cfd6e0;
    --tint: #e9f0fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    width: 420mm; height: 594mm; overflow: hidden;
    padding: calc(var(--u) * 2.2) calc(var(--u) * 2.4);   /* 6 枚共通 */
    font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif;
    font-feature-settings: "palt" 1; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  svg { display: block; }

  /* ── ヘッダ ─────────────────────────────────────────────── */
  .head { display: flex; align-items: center; gap: calc(var(--u) * 1.8); }
  /* ── パネル番号と小見出しは 6 枚共通の寸法 ─────────────────── */
  .no {
    background: var(--navy-d); color: #fff; font-weight: 900;
    font-size: calc(var(--u) * 3.4); line-height: 1; letter-spacing: -0.02em;
    padding: calc(var(--u) * 0.85) calc(var(--u) * 1.5); border-radius: 1.6mm;
  }
  .eyebrow { font-size: calc(var(--u) * 1.8); color: #46505f; letter-spacing: 0.05em; }
  h1 {
    font-size: calc(var(--u) * 7.2); font-weight: 900; letter-spacing: -0.04em;
    line-height: 1.16; margin-top: calc(var(--u) * 1.1); color: var(--navy);
  }
  .sub { font-size: calc(var(--u) * 2.15); color: #2c3648; margin-top: calc(var(--u) * 1.1); }

  /* ── 箱の共通 ───────────────────────────────────────────── */
  /* 箱そのものが縦の余りを吸う。中身の行数に比例して配る(流れ 4 段 : 一覧 2 行)。 */
  .box {
    border: 0.6mm solid var(--line); border-radius: 2.6mm; background: #fff;
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2);
    display: flex; flex-direction: column; min-height: 0;
    flex: 1 1 auto;
  }
  .box.flowbox { flex-grow: 1.75; }
  .box.idxbox { flex-grow: 1; }
  .box + .box { margin-top: calc(var(--u) * 1.5); }
  .cap {
    display: flex; align-items: center; gap: calc(var(--u) * 1.2);
    font-size: calc(var(--u) * 2.05); font-weight: 900; color: var(--navy);
    letter-spacing: 0.04em; justify-content: center; margin-bottom: calc(var(--u) * 1.2);
  }
  .cap::before, .cap::after { content: ""; height: 0.4mm; background: var(--line); flex: 1; }

  /* ── 流れ ───────────────────────────────────────────────── */
  .flow { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
  .stp {
    border: 0.55mm solid var(--line); border-radius: 2mm; background: #fff;
    display: grid; grid-template-columns: calc(var(--u) * 7.5) calc(var(--u) * 4.4) 1fr;
    align-items: center; column-gap: calc(var(--u) * 1.2);
    padding: calc(var(--u) * 1.05) calc(var(--u) * 1.6);
  }
  .stp .ic { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
  .stp .n {
    width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: 50%;
    background: var(--navy-d); color: #fff; font-weight: 900; font-size: calc(var(--u) * 2.05);
    display: flex; align-items: center; justify-content: center;
  }
  .stp .t { font-size: calc(var(--u) * 3.1); font-weight: 900; color: var(--navy); letter-spacing: -0.01em; }
  .ar {
    width: 0; height: 0; margin: calc(var(--u) * 0.55) auto;
    border-left: calc(var(--u) * 1.5) solid transparent;
    border-right: calc(var(--u) * 1.5) solid transparent;
    border-top: calc(var(--u) * 1.6) solid var(--navy);
  }

  /* ── 見るもの ───────────────────────────────────────────── */
  .idx { flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
         gap: calc(var(--u) * 1.1); min-height: 0; }
  .idx .c {
    border: 0.55mm solid var(--line); border-radius: 2mm; background: #fff;
    display: grid; grid-template-columns: calc(var(--u) * 4.6) 1fr; column-gap: calc(var(--u) * 1);
    align-items: center; padding: calc(var(--u) * 0.9) calc(var(--u) * 1.1);
  }
  .idx .c.self { background: var(--tint); border-color: #9fb8d8; }
  .idx .c .k {
    background: var(--navy-d); color: #fff; border-radius: 1.2mm; text-align: center;
    font-size: calc(var(--u) * 1.75); font-weight: 900; padding: calc(var(--u) * 0.32) 0;
  }
  .idx .c .l { font-size: calc(var(--u) * 1.95); font-weight: 800; color: var(--navy); line-height: 1.32; }
</style>

<div class="head">
  <div class="no">01</div>
  <p class="eyebrow">生成AIなんでも展示会 Vol.6　出展パネル</p>
</div>
