<style>
  /* ── 生成画像をそのまま A2(420 × 594mm)へ載せる薄い器。

     幅を紙面いっぱいに合わせ、上下に地色の余白が入る形で中央に置く

  @page { size: 420mm 594mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #FCFDFE; }
  body {
    width: 420mm; height: 594mm; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  img { display: block; width: 420mm; height: auto; }
</style>
